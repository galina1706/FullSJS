<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мистецтво SVG: фігури та анімація</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<nav style="background: #2c3e50; padding: 15px; text-align: center; font-family: sans-serif; box-sizing: border-box;">
  <a href="../" style="color: #e74c3c; text-decoration: none; font-weight: bold; margin-right: 30px; float: left;">⬅ Назад до всіх домашок</a>
  <span style="color: #fff; margin-right: 15px; font-weight: bold;">Ви переглядаєте:</span>

<main class="svg-container">
  <h1>Колекція SVG фігур</h1>
  <svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="50" width="100" height="100" class="shape-square" />
    <rect x="150" y="70" width="140" height="80" class="shape-rectangle" />
    <circle cx="370" cy="110" r="50" class="shape-circle animated-shape" />
    <svg x="460" y="60">
      <ellipse cx="60" cy="50" rx="50" ry="30" class="shape-ellipse" />
    </svg>
  </svg>
</main>
</body>
