<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Закріплюємо Float Layout</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="container">
    <div class="block1"></div>
    <div class="block2"></div>
</div>
<div class="container">
    <div class="block left"></div>
    <div class="block right"></div>
    <div class="block right"></div>
    <div class="block right"></div>
</div>
<div class="container">
    <div class="block left"></div>
    <div class="block left"></div>
    <div class="block right"></div>
    <div class="block right"></div>
</div>
<div class="container">
    <div class="group">
        <div class="block big"></div>
        <div class="stack">
            <div class="block small"></div>
            <div class="block small"></div>
        </div>
    </div>
</div>
<div class="container">
    <div class="group-center">
        <div class="block big"></div>
        <div class="stack">
            <div class="block small"></div>
            <div class="block small"></div>
        </div>
    </div>
</div>
</body>
</html>
